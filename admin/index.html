<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — VisionQast</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <style>
    .login-grid-bg {
      background-image:
        linear-gradient(rgba(22,20,46,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,20,46,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .login-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: .5rem;
      padding: .625rem .875rem;
      font-size: 13px;
      color: #ef4444;
      display: none;
      margin-bottom: 1rem;
    }
    .pw-toggle { background:none; color:var(--text-muted); padding:4px; transition:var(--transition); }
    .pw-toggle:hover { color:var(--text); }
    .input-group { position:relative; display:flex; align-items:center; }
    .input-group .form-control { padding-right: 2.5rem; }
    .input-group-suffix { position:absolute; right:.75rem; }
  </style>
</head>
<body class="login-grid-bg">

<div class="login-page">
  <!-- Background orbs -->
  <div class="login-bg-orb" style="width:500px;height:500px;background:rgba(99,102,241,0.12);top:-200px;left:-200px;"></div>
  <div class="login-bg-orb" style="width:400px;height:400px;background:rgba(168,85,247,0.08);bottom:-150px;right:-150px;"></div>

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="sidebar-logo-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" fill="white" fill-opacity="0.9"/>
          <path d="M2 17l10 5 10-5" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
          <path d="M2 12l10 5 10-5" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <span class="sidebar-brand">Vision<span>Qast</span></span>
      <span class="sidebar-badge">Admin</span>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to access the VisionQast control panel</p>

    <!-- Error message -->
    <div class="login-error" id="login-error"></div>

    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="on" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Email address</label>
        <input
          id="login-email"
          type="email"
          class="form-control"
          placeholder="admin@visionqast.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-group">
          <input
            id="login-password"
            type="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="input-group-suffix pw-toggle" onclick="togglePw()" id="pw-toggle" title="Show/hide">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-bottom:1.25rem">
        <a href="#" id="forgot-link" onclick="handleForgotPassword(event)" style="font-size:12.5px;color:var(--accent);transition:var(--transition)">
          Forgot password?
        </a>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;padding:.75rem;font-size:14px;">
        <span id="login-btn-text">Sign In</span>
        <span class="loading-spinner" id="login-spinner" style="display:none;width:16px;height:16px;"></span>
      </button>
    </form>

    <!-- Reset confirmation -->
    <div id="reset-msg" style="display:none;margin-top:1rem;padding:.625rem .875rem;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);border-radius:.5rem;font-size:12.5px;color:#22c55e">
      Password reset email sent. Check your inbox.
    </div>

    <div style="margin-top:1.5rem;text-align:center;font-size:12px;color:var(--text-muted)">
      Protected area. Unauthorized access is prohibited.
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/assets/js/firebase-config.js"></script>
<script>
  /* Redirect if already logged in */
  if (typeof auth !== 'undefined') {
    auth.onAuthStateChanged(async (user) => {
      if (!user) return;
      try {
        const adminDoc = await db.collection('admins').doc(user.uid).get();
        if (adminDoc.exists && adminDoc.data().role === 'admin') {
          window.location.href = '/admin/dashboard.html';
        }
      } catch (e) { /* not admin */ }
    });
  }

  function togglePw() {
    const inp = document.getElementById('login-password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function showError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('login-error').style.display = 'none';
  }

  function setLoading(on) {
    const btn   = document.getElementById('login-btn');
    const txt   = document.getElementById('login-btn-text');
    const spin  = document.getElementById('login-spinner');
    btn.disabled  = on;
    txt.style.display  = on ? 'none' : 'inline';
    spin.style.display = on ? 'inline-block' : 'none';
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideError();

    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;

    if (!email || !pass) { showError('Please enter your email and password.'); return; }

    if (typeof auth === 'undefined') {
      showError('Firebase is not configured. Please add your config to firebase-config.js');
      return;
    }

    setLoading(true);

    try {
      const cred = await auth.signInWithEmailAndPassword(email, pass);

      /* Check admin role */
      const adminDoc = await db.collection('admins').doc(cred.user.uid).get();
      if (!adminDoc.exists || adminDoc.data().role !== 'admin') {
        await auth.signOut();
        showError('Access denied. You are not an authorized administrator.');
        setLoading(false);
        return;
      }

      window.location.href = '/admin/dashboard.html';
    } catch (err) {
      setLoading(false);
      const errMap = {
        'auth/user-not-found':      'No account found with this email.',
        'auth/wrong-password':      'Incorrect password. Please try again.',
        'auth/invalid-email':       'Please enter a valid email address.',
        'auth/user-disabled':       'This account has been disabled.',
        'auth/too-many-requests':   'Too many failed attempts. Please try again later.',
        'auth/invalid-credential':  'Invalid credentials. Check your email and password.',
      };
      showError(errMap[err.code] || 'Login failed: ' + err.message);
    }
  }

  async function handleForgotPassword(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    if (!email) { showError('Enter your email address first.'); return; }
    if (typeof auth === 'undefined') { showError('Firebase not configured.'); return; }

    try {
      await auth.sendPasswordResetEmail(email);
      document.getElementById('reset-msg').style.display = 'block';
      hideError();
    } catch (err) {
      showError('Could not send reset email: ' + err.message);
    }
  }
</script>
</body>
</html>
