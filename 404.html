<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — VisionQast</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .nf-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; position:relative; overflow:hidden; padding:2rem; }
    .nf-code { font-family:'Sora',sans-serif; font-size:clamp(6rem,20vw,12rem); font-weight:800; line-height:1; letter-spacing:-0.06em;
      background:var(--grad-text); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .nf-wrap h1 { font-size:clamp(1.6rem,4vw,2.4rem); margin:0.5rem 0 1rem; }
    .nf-wrap p { color:var(--ink-soft); max-width:440px; margin:0 auto 2rem; }
  </style>
</head>
<body>
  <div class="nf-wrap mesh-grid">
    <div class="orb" style="width:520px;height:520px;background:radial-gradient(circle,#A78BFA,transparent 70%);top:-180px;left:-120px"></div>
    <div class="orb" style="width:460px;height:460px;background:radial-gradient(circle,#06B6D4,transparent 70%);bottom:-160px;right:-120px;opacity:0.4"></div>
    <div style="position:relative;z-index:1">
      <div class="nf-code">404</div>
      <h1>This page took a wrong turn</h1>
      <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
      <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">
        <a href="/index.html" class="btn btn-primary btn-lg">← Back to Home</a>
        <a href="/contact.html" class="btn btn-ghost btn-lg">Contact Us</a>
      </div>
    </div>
  </div>
</body>
</html>
