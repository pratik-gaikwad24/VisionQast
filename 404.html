<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Page Not Found | VisionQast</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050810;
      --accent: #6366f1;
      --neon: #00c6ff;
      --text: #f0f4ff;
      --sub: #8892b0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.18), transparent);
      top: -100px; left: -100px;
      animation: blobA 8s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(168,85,247,0.14), transparent);
      bottom: -100px; right: -100px;
      animation: blobA 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobA {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,40px) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 2rem;
      max-width: 580px;
    }

    .logo {
      display: inline-block;
      margin-bottom: 3rem;
    }

    .logo img {
      height: 52px;
      background: #fff;
      padding: 5px 12px;
      border-radius: 10px;
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #00c6ff, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(99,102,241,0.4)); }
      50%       { filter: drop-shadow(0 0 35px rgba(168,85,247,0.7)); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      color: var(--sub);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.8rem;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(99,102,241,0.6);
    }

    .btn-outline {
      border: 1px solid rgba(99,102,241,0.4);
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }

    .btn-outline:hover {
      border-color: var(--neon);
      color: var(--neon);
      transform: translateY(-3px);
    }

    /* Floating particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      from { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      to   { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/" class="logo">
      <img src="images/logo.png" alt="VisionQast" />
    </a>

    <div class="error-code">404</div>

    <h1>Page Not Found</h1>
    <p>
      Oops! The page you're looking for doesn't exist or has been moved.<br />
      Let's get you back on track.
    </p>

    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
      <a href="/#contact" class="btn btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Contact Us
      </a>
    </div>
  </div>

  <script>
    /* Generate floating particles */
    const colors = ['99,102,241','168,85,247','0,198,255','236,72,153'];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 1;
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}vw;
        background:rgba(${color},${Math.random() * 0.5 + 0.2});
        animation-duration:${Math.random() * 12 + 8}s;
        animation-delay:${Math.random() * -15}s;
      `;
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
