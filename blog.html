<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — VisionQast</title>
  <meta name="description" content="Insights on software engineering, product development, AI, and startup growth from the VisionQast team." />
  <link rel="canonical" href="https://visionqast.com/blog.html" />
  <meta name="theme-color" content="#F5F6FC" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

<div id="site-nav"></div>

<main>
  <!-- ═══ PAGE HERO ═══ -->
  <section class="page-hero mesh-grid">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="container">
      <div class="eyebrow" data-reveal>Insights</div>
      <h1 class="page-hero-title" data-reveal data-delay="1">From Our<br><span class="gradient-text">Engineering Blog</span></h1>
      <p class="lead" data-reveal data-delay="2">Practical insights on building software, scaling products, and growing technology businesses.</p>
      <div class="crumb" data-reveal data-delay="3"><a href="/index.html">Home</a> / <span>Blog</span></div>
    </div>
  </section>

  <!-- ═══ BLOG GRID ═══ -->
  <section class="section">
    <div class="container">
      <div class="blog-grid" id="blog-grid"></div>
    </div>
  </section>

  <!-- ═══ NEWSLETTER CTA ═══ -->
  <section class="section-sm">
    <div class="container">
      <div class="cta-band" data-reveal>
        <h2>Never Miss an Insight</h2>
        <p>Get our best articles on engineering, product, and growth delivered to your inbox weekly. No spam, unsubscribe anytime.</p>
        <form class="cta-actions" id="newsletter-cta" style="max-width:460px;margin:0 auto" onsubmit="event.preventDefault();this.querySelector('button').textContent='✓ Subscribed!';this.querySelector('input').value=''">
          <input type="email" class="f-input" placeholder="your@email.com" style="flex:1;min-width:200px;background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2);color:#fff" required />
          <button type="submit" class="btn btn-light btn-lg">Subscribe →</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/assets/js/firebase-config.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/script.js"></script>
</body>
</html>
